name: Deploy to GitHub Pages

on:
  # Deploy on every push to the default branch. Both names are listed so
  # the workflow works whether the repository's default branch is `main`
  # or `master`; only the one that exists will ever fire.
  push:
    branches: [main, master]
  # Lets a deploy be re-run by hand from the Actions tab without a new
  # commit - useful after changing Pages settings or re-deploying the
  # Apps Script backend.
  workflow_dispatch:

permissions:
  contents: read # checkout
  pages: write # publish to the Pages service
  id-token: write # OIDC token deploy-pages exchanges for its deployment

# One deploy at a time. `cancel-in-progress: true` means a rapid series of
# pushes doesn't queue up a deploy per commit - earlier runs are abandoned
# and only the newest commit is published.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # '20' resolves to the latest Node 20.x, which satisfies Vite 8's
      # engines constraint (^20.19.0 || >=22.12.0). `cache: npm` keys the
      # dependency cache off package-lock.json.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `npm ci` (not `npm install`) so the deployed bundle is built from
      # the exact dependency tree committed in package-lock.json.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Pages serves the artifact as-is, so this uploads Vite's output
      # directory itself - dist/index.html becomes the site root.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Declaring the github-pages environment is what gives this job the
    # deployment permissions, and `url` surfaces the live link on the run
    # summary and in the repo's Environments tab.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
